include ':app'

def cordovaPluginsDir = new File(rootDir, 'capacitor-cordova-android-plugins')
if (cordovaPluginsDir.exists() && new File(cordovaPluginsDir, 'build.gradle').exists()) {
    include ':capacitor-cordova-android-plugins'
    project(':capacitor-cordova-android-plugins').projectDir = cordovaPluginsDir
}

def capacitorSettings = new File(rootDir, 'capacitor.settings.gradle')
if (capacitorSettings.exists()) {
    apply from: capacitorSettings
}